# Experiment plan configuration
experiment_name: "ks_day_ablation"

# Base configuration (will be used for all experiments)
base_config:
  problem: ks
  model: AToE                        # 'AToE' | 'AToELeaves' | 'ANT'
  activation: tanh                   # Activation function for all networks

  # ── Training duration (Phase 3 when using 3-phase, or total when single-phase) ──
  epochs: 10000                          # Total training epochs (accept_split_by_norm ignores initial_train)
  batch_size: 4096                    # Mini-batch size for Adam/SOAP training
  patience_epochs: 50000             # Effectively disabled
  min_epochs: 1                      # No early-stop floor

  # ── Primary optimizer ──
  # ── Optimizer configuration ──
  optimizer_1: soap                  # First optimizer: 'adam' | 'soap' | 'ssbroyden'
  optimizer_2: null                  # No second optimizer — let SOAP run full duration
  optimizer_switch_epoch: 5000       # Unused (no switch)
  lr: 0.001                          # Base (peak) learning rate

  # ── LR scheduling (applies to optimizer_1 only, step-based) ──
  lr_schedule: exponential                # 'none' (constant lr), 'exponential' (step decay), 'cosine' (cosine annealing to 0)
  lr_warmup_steps: 1000               # ~200 epochs at 5 steps/epoch (20k points / batch 4096)
  lr_warmup_start_factor: 0.01        # Warmup starts at this fraction of base lr (0.01 = 1% of lr)
  lr_decay_rate: 0.9                 # For exponential: multiply lr by this factor every lr_decay_steps
  lr_decay_steps: 8000               # Slow decay over 5000 epochs
  new_expert_lr_decay: 0.1           # LR scale for newly spawned expert param group: lr_new = current_lr × this
                                     # 1.0 = no decay (current behavior); 0.1 = gentle entry (plan Tier 2)

  # ── SOAP-specific (only used when optimizer_1 or _2 is 'soap') ──
  soap_betas: [0.95, 0.95]          # KS-tuned: symmetric betas work better for chaotic dynamics
  soap_precondition_frequency: 10    # How often SOAP updates its Shampoo-style preconditioner.
  soap_weight_decay: 0.0             # Weight decay for SOAP

  # ── L-BFGS specific (only used when optimizer_1 or _2 is 'lbfgs') ──
  lbfgs_lr: 1.0                     # L-BFGS learning rate (line search makes this effectively a max step size).
  lbfgs_max_iter: 20                 # Max L-BFGS iterations per step.
  lbfgs_history_size: 20             # L-BFGS history size (number of past updates stored).
  lbfgs_line_search: 'strong_wolfe'  # L-BFGS line search algorithm.
  lbfgs_tolerance_grad: 0.0          # Gradient tolerance for L-BFGS convergence. 0 = disabled.
  lbfgs_tolerance_change: 0.0        # Loss change tolerance for L-BFGS convergence. 0 = disabled.

  # ── SSBroyden-specific (only used when optimizer_1 or _2 is 'ssbroyden') ──
  ssbroyden_history_size: 10         # Number of correction pairs stored. Paper uses default (~10).
  ssbroyden_max_iter: 20             # Inner iterations per closure call. Paper: 20k-30k total iters full-batch.
  ssbroyden_line_search: strong-wolfe  # Line search. Paper (vRBA 2025): Strong Wolfe.

  # ── Adam hyperparameters (only used when optimizer_1 or _2 is 'adam') ──
  adam_betas: [0.9, 0.999]           # Adam momentum parameters (beta1, beta2). Standard default.
  adam_eps: 1.0e-8                   # Adam epsilon for numerical stability.

  # ── General training settings ──
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100                    # Evaluate every N epochs
  print_every: 100                   # Print progress every N epochs
  save_every: 1000                   # Save checkpoint every N epochs
  inner_metrics_eval_every: 1000     # Run NCC/probes/derivatives analysis every N epochs
  seed: 42
  use_decomposed_derivatives: false  # Use decomposed derivative computation for experts

  # ══════════════════════════════════════════════════════════════════════════════
  # PER-PROBLEM CONFIGURATION
  # Each problem section MUST include all required fields. No global defaults.
  # Required per-problem fields: rwf, fourier_features, init, lra, adaptive_sampling,
  #                              grad_clip_norm, expert_grad_clip_norm
  # ══════════════════════════════════════════════════════════════════════════════

  schrodinger:
    spatial_dim: 1
    output_dim: 2                    # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1            # Geometric wavelet norm threshold for tree pruning
    new_norm_threshold: 2.0           # New norm threshold (sum of children classic norms)
    tree_smoothness_threshold: 0.7   # Besov smoothness threshold (per-problem override)
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  wave1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2pi
    wavelet_threshold: 0.3
    new_norm_threshold: 1.5
    tree_smoothness_threshold: 0.35
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.003141592653589793         # Viscosity (effective viscosity = nu/pi = 1/1000, "hard" benchmark)
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  burgers2d:
    spatial_dim: 2
    output_dim: 1
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1                          # Viscosity coefficient
    wavelet_threshold: 0.0005
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001                        # Diffusion coefficient (SOTA benchmark standard)
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights:
      residual: 1.0
      ic: 100.0                      # Strong IC enforcement — stiff problem needs to lock in IC early
      bc: 1.0
    causal_training:                 # Paper-recommended params (Wang et al. 2022)
      enabled: true                  # Causal weighting on residual loss
      num_chunks: 32                 # Temporal bins (keep 32, enough for 20k points)
      tol_schedule: [0.01, 0.1, 1.0, 10.0]  # Extended from [0.01, 0.1, 1.0] for 4000 epochs
      min_weight_threshold: 0.99
    # ── Per-problem features (no global defaults) ──
    rwf: true
    fourier_features:
      enabled: true
      dim: 128
      scale: 3.0                     # Higher scale for very sharp interfaces (D=0.0001)
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: true
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: exponential               # quadratic | exponential | power
      phi_epsilon: 1.0               # scale ε for exponential phi
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.000484                     # mu^2 = 4.84e-4 (Zabusky & Kruskal values)
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:                 # Paper-recommended params (Wang et al. 2022)
      enabled: false
      num_chunks: 50
      tol_schedule: [0.1, 1.0, 10.0]
      min_weight_threshold: 0.99
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: exponential
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  fisher_kpp:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 1.0
    kappa: 25.0
    wavelet_threshold: 0.0005
    new_norm_threshold: 0.005
    tree_smoothness_threshold: 0.6
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  conv_diff:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    beta: 1.0                        # Convection coefficient
    epsilon: 0.01                    # Diffusion coefficient (Peclet = 100)
    wavelet_threshold: 0.005
    new_norm_threshold: 0.05
    tree_smoothness_threshold: 0.6
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    # ── Per-problem features (no global defaults) ──
    rwf: false
    fourier_features:
      enabled: false
      dim: 128
      scale: 1.0
      periodic: false
    init:
      hidden: glorot
      output: ls
      ls_use_bias: true
      spectral_norm: false
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]  # 2*pi
    temporal_domain: [0.0, 1.0]
    alpha: 6.25                      # 100/16
    beta: 0.390625                   # 100/16^2
    gamma: 0.00152587890625          # 100/16^4
    wavelet_threshold: 0.04          
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights:
      residual: 1.0
      # PirateNets paper (Wang et al. JMLR 2024) uses ic=1 on KS with LS-init.
      # We use 10 as a conservative choice: LS-init satisfies IC at epoch 0,
      # so extreme ic weighting (100) is no longer needed.
      ic: 10.0
      bc: 1.0                        # Periodic BC is soft — low weight, FF can help enforce periodicity
    causal_training:
      enabled: true                  # Always on for KS — essential for learning chaotic dynamics
      num_chunks: 16                 # Fine-grained temporal bins — smoother causal progression
      tol_schedule: [0.01]  # Annealing schedule (Wang et al. 2022): start soft, harden as network learns
      min_weight_threshold: 0.99     # Paper default — strict convergence before advancing
      per_leaf_causal: true          # Feature B: each leaf gets its own independent causal state
    # ── Per-problem features (KS-tuned, latest config) ──
    rwf: true
    fourier_features:
      enabled: true
      dim: 128
      scale: 2.0                     # Conservative — KS has broadband content, not sharp interfaces
      periodic: false
    init:
      hidden: parent_weights         # New experts copy hidden-layer weights from closest ancestor
      output: ls                     # Least-squares fit to IC data (base model only)
      ls_use_bias: true
      spectral_norm: true            # Bounds Lipschitz constant — prevents h_xxxx overflow in KS
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: false                 # Disabled for KS by default; experiments can enable
      adaptive_ratio: 0.1
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: 1.0
    expert_grad_clip_norm: 1.0

  # ── Dataset sampling ratios (global) ──
  sampling:
    sample_volume_ratio: 35          # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.026       # ~260 IC points (with n_residual=20000). Papers use 256-512.
    boundary_train_ratio: 0.026      # ~260 BC points (with n_residual=20000). Papers use 200+.
    eval_train_ratio: 0.25           # eval = 25% of train (all types)
    ncc_train_ratio: 0.25            # ncc = 25% of residual_train
    resample_every_epochs: 100       # Regenerate training data every N epochs. Papers use 500.
    min_points_per_leaf: 50          # Minimum adaptive points per leaf (per_leaf_sampling only); 0 = disabled

  # ── Adaptive Expert PINN configuration (Tree-Based Spawning) ──
  adaptive_pinn:
    enabled: true                              # Toggle adaptive expert spawning on/off
    max_experts: 150                           # Maximum number of expert networks
    spawn_every_epochs: 500                   # Check for spawning every N epochs (matches initial_train.epochs)
    variable_for_node_accept: norm             # "norm" | "new_norm" | "smoothness" -- metric to use for node acceptance/pruning
    variable_for_expert_size: norm             # "norm" | "new_norm" | "smoothness" -- metric to use for expert architecture sizing
    AToE_threshold_capacity: null              # null = same as base, int = base capacity at threshold norm
    ANT_threshold_architecture: null             # null = uses ANT_default_hidden_layers, int = threshold width with scaling
    ANT_default_hidden_layers: 50              # Neuron width for ANT experts (int; expands to [n] mlp or [n,n] resnet)
    expert_type: resnet                # 'mlp' or 'resnet' or 'piratenet' -- architecture for base model and experts
    max_depth: 5                       # Maximum tree depth for region splitting
    freeze_mode: none                      # "none" | "previous" | "base_only" — Fix 2 uses this; 'previous' = freeze base+old experts post-spawn
    blending_mode: soft                        # "hard" | "soft" (soft = partition of unity)
    sigma_fraction: 0.2                        # For soft blending: sigma = fraction * region_size (per-dimension)
    base_weight: 0.3                           # Uniform weight for base model (soft blending only)
    base_everywhere: true                      # If false, u_0 has indicator = domain \ experts
    tree_max_depth: 15                         # Max depth of decision tree for region splitting
    tree_min_samples_leaf: 50                  # Min samples in tree leaf node
    enable_timing: false                       # Enable epoch timing profiling (can slow down training)
    inner_metrics_calculation: false            # Disable NCC/probes during training (complex with experts)
    enable_gradient_diagnostics: false          # Enable detailed gradient flow diagnostics (verbose)
    use_decomposed_derivatives: false
    expert_activation_threshold: 0             # null = disabled, float = only evaluate experts with psi > threshold
    relevant_samples_to_activate_expert: 0     # Min samples in batch for expert to be considered "active"
    spawning_method: accept_split_by_norm         # "by_mean_residual" | "accept_split_by_norm" | "full_tree_by_norm" | "use_perfect_trees"
    perfect_trees_path: perfect_tree_examples/classic_norm/perfect_trees.json  # Path to pre-computed perfect trees JSON (only for use_perfect_trees)

    # ── Post-spawn freeze (Fix 2) ──
    # After spawning, freeze base+old experts for N epochs so only the newest expert trains.
    # Calibration: warmup_epochs = lr_warmup_steps / (n_residual/batch_size) = 1000/5 = 200ep.
    # freeze_400 = 2× warmup. With spawn_every=500 this gives ~400ep solo + ~100ep joint before next check.
    # 0 = disabled (all models train together immediately after spawn).
    freeze_epochs_after_spawn: 400

    # ── Plateau-gated spawning (Fix 3) ──
    # spawn_every_epochs = minimum interval between spawns.
    # Once that interval elapses, plateau is checked every epoch until met, then spawn fires.
    # Plateau measured on training loss to avoid using ground truth (pure PINN spirit).
    # spawn_plateau_epochs should be a multiple of resample_every_epochs (currently 100) so both
    # ends of the look-back window fall at the same phase in the resampling cycle (apples-to-apples).
    # 300 = 3 × 100 ✓. With spawn_every=500 this fits well within one spawn interval.
    spawn_require_plateau: true     # Disabled by default; plateau experiments enable this
    spawn_plateau_epochs: 50        # look-back window (3× resample_every = fair loss comparison)
    spawn_plateau_delta: 0.05        # spawn only if training loss improved <1% over the window
    spawn_retries_before_stop: 5  # false = never stop. 0 = stop on first failed spawn attempt.
                                      # N = allow N retries; counter resets to N after any success.
    spawn_retry_after: 10            # epochs to wait before retrying after a failed spawn attempt.
                                      # Counted from the failure epoch (not aligned to spawn_every).
                                      # Plateau gating still applies at the retry check.

    # ── 3-Phase training config ──
    # full_tree_by_norm: Phase 1 trains base, Phase 2 fits tree + spawns, Phase 3 trains full model.
    # use_perfect_trees: SKIPS Phase 1, loads pre-computed tree from perfect_trees_path, spawns experts, then Phase 3.
    # For other methods, initial_train is ignored.
    # If initial_train is absent, single-phase behavior is preserved (backwards compatible).
    reinitialize_base_after_spawn: false        # If true, reinitialize base model weights after expert creation (before Phase 3)
    initial_train:
      epochs: 4000                               # Phase 1: train base model before tree fitting


experiments:
