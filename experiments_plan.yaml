# Experiment plan configuration
experiment_name: "schrodinger_tests"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  activation: tanh
  epochs: 10
  batch_size: 512
  lr: 0.0001
  
  # Optimizer settings
  optimizer_switch_at: 0.9
  
  # Adam hyperparameters
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  
  # LBFGS hyperparameters
  lbfgs_lr: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 20
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0  # Set to 0 to disable gradient-based convergence check
  lbfgs_tolerance_change: 0.0  # Set to 0 to disable loss change convergence check
  
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 2
  print_every: 1
  save_every: 5
  inner_metrics_eval_every: 4
  seed: 42
  
  # Problem-specific domains and loss weights
  schrodinger:
    spatial_dim: 1
    output_dim: 2  # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  wave1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2π
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers2d:
    spatial_dim: 2
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  # Dataset sampling ratios
  sampling:
    sample_volume_ratio: 35      # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.005   # 0.5% of residual_train
    boundary_train_ratio: 0.005  # 0.5% of residual_train
    eval_train_ratio: 0.25       # eval = 25% of train (all types)
    ncc_train_ratio: 0.25        # ncc = 25% of residual_train 

  # Adaptive Expert PINN configuration (Tree-Based Spawning)
  adaptive_pinn:
    enabled: true                    # Toggle feature on/off (override per experiment)
    max_experts: 10                 # Maximum number of expert networks
    spawn_every_epochs: 2   # Check for spawning every N epochs (quick test value)
    expert_hidden_layers: [30]       # Hidden layers for experts (input_dim auto-determined from parent)
    expert_architectures: null        # DEPRECATED: use expert_hidden_layers instead
    freeze_mode: none                 # "none" | "previous" | "base_only"
    blending_mode: soft               # "hard" | "soft"
    sigma_fraction: 0.2               # For soft: sigma = fraction * region_size (per-dimension)
    base_weight: 1.0                  # Uniform weight for base model (soft blending only)
    base_everywhere: true             # If false, u_0 has indicator = domain \ experts
    # ============================================================
    # PRETRAINED CASE - COMMENTED OUT (ANT design uses non-pretrained only)
    # Will be removed in future cleanup
    # ============================================================
    pretrained_base_model: false       # If true, load base from path and freeze
    pretrained_base_path: null       # 'adaptive\pretrained_bases\schrodinger\schrodinger-2-120-120-120-2-tanh\checkpoints\schrodinger-2-120-120-120-2-tanh\final_model.pt
    wavelet_threshold: 0.0001   # Minimum wavelet norm to spawn (filters low-priority regions)
    tree_max_depth: 15              # Max depth of decision tree (for pretrained case)
    tree_min_samples_leaf: 10       # Min samples in tree leaf node
    enable_timing: true        # Enable epoch timing profiling (can slow down training)
    inner_metrics_calculation: false  # Disable NCC/probes during training (complex with experts)

# Experiments to run
experiments:  
  - name: "4k_experts"
    problem: schrodinger
    architecture: [2, 30, 2]

