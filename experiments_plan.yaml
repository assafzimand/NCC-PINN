# Experiment plan configuration
experiment_name: "norm_control_tests"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  activation: tanh
  epochs: 10000
  batch_size: 512
  lr: 0.0001
  
  # Optimizer settings
  optimizer_switch_at: 0.9
  
  # Adam hyperparameters
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  
  # LBFGS hyperparameters
  lbfgs_lr: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 20
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0  # Set to 0 to disable gradient-based convergence check
  lbfgs_tolerance_change: 0.0  # Set to 0 to disable loss change convergence check
  
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 500
  print_every: 100
  save_every: 5000
  inner_metrics_eval_every: 3334
  seed: 42
  
  # Problem-specific domains and loss weights
  schrodinger:
    spatial_dim: 1
    output_dim: 2  # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  wave1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2π
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers2d:
    spatial_dim: 2
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  # Dataset sampling ratios
  sampling:
    sample_volume_ratio: 35      # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.005   # 0.5% of residual_train
    boundary_train_ratio: 0.005  # 0.5% of residual_train
    eval_train_ratio: 0.25       # eval = 25% of train (all types)
    ncc_train_ratio: 0.25        # ncc = 25% of residual_train 

  # Residual Norm Control (RNC) settings
  # Penalizes hidden layer residual term norms that exceed last layer targets
  residual_norm_control:
    enabled: true                     # Set to true to enable RNC
    update_target_norms_every: 500     # Epochs between target norm updates
    base_weight: 0.01                   # Weight for layer 1 (smaller than original loss)
    weight_growth_factor: 1.0          # Multiplier per layer (1.0 = uniform across layers)

# Experiments to run
experiments:  
  # 1. Very small weight with less frequent updates
  - name: "bw0.00001_upd1000"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.00001
      update_target_norms_every: 1000
      weight_growth_factor: 1.0

  # 2-4. Vary base_weight (with default update_every=500)
  - name: "bw0.001_upd500"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.001
      update_target_norms_every: 3000
      weight_growth_factor: 1.0

  - name: "bw0.0001_upd500"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.0001
      update_target_norms_every: 500
      weight_growth_factor: 1.0

  - name: "bw0.00001_upd500"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.00001
      update_target_norms_every: 500
      weight_growth_factor: 1.0

  # 5-6. Vary update frequency (with small base_weight)
  - name: "bw0.0001_upd1000"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.0001
      update_target_norms_every: 1000
      weight_growth_factor: 1.0

  - name: "bw0.0001_upd2000"
    problem: schrodinger  
    architecture: [2, 100, 100, 100, 100, 100, 2]
    residual_norm_control:
      enabled: true
      base_weight: 0.0001
      update_target_norms_every: 2000
      weight_growth_factor: 1.0

