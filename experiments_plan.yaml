# Experiment plan configuration
experiment_name: "perfect_trees_new_norm_test"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  model: AToE                        # 'AToE' | 'AToELeaves' | 'ANT'
  activation: tanh                   # Activation function for all networks

  # ── Training duration (Phase 3 when using 3-phase, or total when single-phase) ──
  epochs: 0                          # No real training — just spawn experts and save
  batch_size: 2048                    # Mini-batch size for Adam/SOAP training
  patience_epochs: 3000              # Stop if eval Rel-L2 doesn't improve for 3000 epochs (~30k steps)
  min_epochs: 5000                      # No early-stop guard needed

  # ── Primary optimizer ──
  # ── Optimizer configuration ──
  optimizer_1: soap                  # First optimizer: 'adam' | 'soap' | 'ssbroyden'
  optimizer_2: null                  # Second optimizer: 'lbfgs' | 'adam' | 'soap' | 'ssbroyden' | null (null = no switch)
  optimizer_switch_epoch: null       # Epoch to switch optimizer_1 → optimizer_2. Ignored when optimizer_2 is null.
                                     # Patience early-stopping only active after switch (or from epoch 1 if no switch).
  lr: 0.001                          # Base (peak) learning rate. Literature standard is 1e-3 (PirateNet, SOAP, vRBA).

  # ── LR scheduling (applies to optimizer_1 only, step-based) ──
  lr_schedule: exponential           # 'none' (constant lr), 'exponential' (step decay), 'cosine' (cosine annealing to 0)
  lr_warmup_steps: 5000              # Steps to linearly ramp lr from ~0 to base lr. 0 = no warmup (paper default).
  lr_decay_rate: 0.9                 # For exponential: multiply lr by this factor every lr_decay_steps.
  lr_decay_steps: 5000               # For exponential: how often (in optimizer steps) to decay.

  # ── SOAP-specific (only used when optimizer_1 or _2 is 'soap') ──
  soap_betas: [0.95, 0.95]          # SOAP momentum parameters (beta1, beta2). Paper default.
  soap_precondition_frequency: 10    # How often SOAP updates its Shampoo-style preconditioner.

  # ── L-BFGS specific (only used when optimizer_1 or _2 is 'lbfgs') ──
  lbfgs_lr: 1.0                     # L-BFGS learning rate (line search makes this effectively a max step size).
  lbfgs_max_iter: 20                 # Max L-BFGS iterations per step.
  lbfgs_history_size: 20             # L-BFGS history size (number of past updates stored).
  lbfgs_line_search: 'strong_wolfe'  # L-BFGS line search algorithm.
  lbfgs_tolerance_grad: 0.0          # Gradient tolerance for L-BFGS convergence. 0 = disabled.
  lbfgs_tolerance_change: 0.0        # Loss change tolerance for L-BFGS convergence. 0 = disabled.

  # ── SSBroyden-specific (only used when optimizer_1 or _2 is 'ssbroyden') ──
  ssbroyden_history_size: 10         # Number of correction pairs stored.
  ssbroyden_max_iter: 1              # Steps per call (similar to lbfgs_max_iter).

  # ── Adam hyperparameters (only used when optimizer_1 or _2 is 'adam') ──
  adam_betas: [0.9, 0.999]           # Adam momentum parameters (beta1, beta2). Standard default.
  adam_eps: 1.0e-8                   # Adam epsilon for numerical stability.

  # ── RWF (Random Weight Factorization) ──
  rwf: false                         # true to apply W_eff = diag(exp(s)) @ W to all hidden layers

  # ── Fourier Features ──
  fourier_features:
    enabled: false                   # true to map input → [cos(Bz), sin(Bz)] before network
    dim: 64                          # number of Fourier features (output = 2*dim)
    scale: 1.0                       # std of random projection matrix B

  # ── LRA (Loss Rate Annealing) ──
  lra:
    enabled: false                   # true to adaptively weight residual/IC/BC losses
    update_every: 100                # epochs between weight updates (3 extra backward passes each)
    alpha: 0.1                       # EMA smoothing factor for weight updates

  # ── General training settings ──
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100                    # Evaluate every N epochs
  print_every: 100                   # Print progress every N epochs
  save_every: 1000                   # Save checkpoint every N epochs
  inner_metrics_eval_every: 1000     # Run NCC/probes/derivatives analysis every N epochs
  seed: 42

  # ── Problem-specific domains, parameters, and loss weights ──
  schrodinger:
    spatial_dim: 1
    output_dim: 2                    # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 10            # Geometric wavelet norm threshold for tree pruning
    tree_smoothness_threshold: 0.2   # Besov smoothness threshold (per-problem override)
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  wave1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2pi
    wavelet_threshold: 5
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.003141592653589793         # Viscosity (effective viscosity = nu/pi = 1/1000, "hard" benchmark)
    wavelet_threshold: 2
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  burgers2d:
    spatial_dim: 2
    output_dim: 1
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1                          # Viscosity coefficient
    wavelet_threshold: 3
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.001                         # Diffusion coefficient
    wavelet_threshold: 2
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    adaptive_sampling:               # phi config for vRBA (only used when sampling.adaptive_sampling.enabled=true)
      phi: exponential               # quadratic | exponential | power
      phi_epsilon: 1.0               # scale ε for exponential phi
    causal_training:                 # Paper-recommended params (Wang et al. 2022)
      enabled: false                 # set true to enable causal weighting
      num_chunks: 50
      tol_schedule: [0.1, 1.0, 10.0]
      min_weight_threshold: 0.99

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.000484                     # mu^2 = 4.84e-4 (Zabusky & Kruskal values)
    wavelet_threshold: 5
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    adaptive_sampling:
      phi: exponential
      phi_epsilon: 1.0
    causal_training:                 # Paper-recommended params (Wang et al. 2022)
      enabled: false
      num_chunks: 50
      tol_schedule: [0.1, 1.0, 10.0]
      min_weight_threshold: 0.99

  fisher_kpp:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 1.0
    kappa: 25.0
    wavelet_threshold: 2
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  conv_diff:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    beta: 1.0                        # Convection coefficient
    epsilon: 0.01                    # Diffusion coefficient (Peclet = 100)
    wavelet_threshold: 5
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]  # 2*pi
    temporal_domain: [0.0, 1.0]
    alpha: 6.25                      # 100/16
    beta: 0.390625                   # 100/16^2
    gamma: 0.00152587890625          # 100/16^4
    wavelet_threshold: 15
    tree_smoothness_threshold: 0.1
    loss_weights:
      residual: 1.0
      ic: 100.0                      # Reduced from 1000: causal training already emphasizes early times
      bc: 1.0
    causal_training:
      enabled: true                  # Causal weighting on residual loss — critical for chaotic KS (Wang et al. 2022)
      num_chunks: 100                # Temporal bins (paper uses full temporal grid, ~100 time points)
      tol_schedule: [0.01, 0.1, 1.0]  # Capped schedule for short runs. Full paper: [0.01, 0.1, 1.0, 10.0, 100.0] (needs 60k+ epochs).
      min_weight_threshold: 0.99     # Advance epsilon when min(w_i) > this (paper: delta=0.99)

  # ── Dataset sampling ratios ──
  sampling:
    sample_volume_ratio: 35          # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.026       # ~260 IC points (with n_residual=20000). Papers use 256-512.
    boundary_train_ratio: 0.026      # ~260 BC points (with n_residual=20000). Papers use 200+.
    eval_train_ratio: 0.25           # eval = 25% of train (all types)
    ncc_train_ratio: 0.25            # ncc = 25% of residual_train
    resample_every_epochs: 10        # Regenerate training data every N epochs. 0 = disabled. Papers use 500.
    adaptive_sampling:
      enabled: false                 # true to mix uniform + residual-adaptive points (vRBA/RAR-D)
                                     # NOTE: only active during resampling (model=None on first call → uniform)
      adaptive_ratio: 0.5            # fraction of residual_train points that are adaptive
      candidate_multiplier: 10       # candidates evaluated = n_adaptive * this (higher → better PDF approx)

  # ── Adaptive Expert PINN configuration (Tree-Based Spawning) ──
  adaptive_pinn:
    enabled: true                              # Toggle adaptive expert spawning on/off
    max_experts: 150                           # Maximum number of expert networks
    spawn_every_epochs: 4000                      # Check for spawning every N epochs (matches initial_train.epochs)
    AToE_threshold_capacity: 1000              # null = same as base, int = base capacity at threshold norm
    ANT_threshold_architecture: 50             # null = uses ANT_default_hidden_layers, int = threshold width with scaling
    ANT_default_hidden_layers: 50              # Neuron width for ANT experts (int; expands to [n] mlp or [n,n] resnet)
    expert_type: mlp                        # 'mlp' or 'resnet' -- architecture for base model and experts
    freeze_mode: none                          # "none" | "previous" | "base_only"
    blending_mode: soft                        # "hard" | "soft" (soft = partition of unity)
    sigma_fraction: 0.2                        # For soft blending: sigma = fraction * region_size (per-dimension)
    base_weight: 1.0                           # Uniform weight for base model (soft blending only)
    base_everywhere: true                      # If false, u_0 has indicator = domain \ experts
    tree_max_depth: 50                         # Max depth of decision tree for region splitting
    tree_min_samples_leaf: 20                  # Min samples in tree leaf node
    enable_timing: false                       # Enable epoch timing profiling (can slow down training)
    inner_metrics_calculation: false            # Disable NCC/probes during training (complex with experts)
    enable_gradient_diagnostics: false          # Enable detailed gradient flow diagnostics (verbose)
    use_decomposed_derivatives: true
    expert_activation_threshold: 0             # null = disabled, float = only evaluate experts with psi > threshold
    relevant_samples_to_activate_expert: 0     # Min samples in batch for expert to be considered "active"
    spawning_method: use_perfect_trees       # "by_mean_loss" | "accept_split_by_norm" | "full_tree_by_norm" | "use_perfect_trees"
    perfect_trees_path: perfect_tree_examples/new_nrom/perfect_trees.json  # Path to pre-computed perfect trees JSON (only for use_perfect_trees)

    # ── 3-Phase training config ──
    # full_tree_by_norm: Phase 1 trains base, Phase 2 fits tree + spawns, Phase 3 trains full model.
    # use_perfect_trees: SKIPS Phase 1, loads pre-computed tree from perfect_trees_path, spawns experts, then Phase 3.
    # For other methods, initial_train is ignored.
    # If initial_train is absent, single-phase behavior is preserved (backwards compatible).
    initial_train:
      epochs: 4000                                # Phase 1: how many epochs to train base model before tree fitting
    reinitialize_base_after_spawn: false        # If true, reinitialize base model weights after expert creation (before Phase 3)


# ===== Experiments to run =====
# 15 runs: 5 problems x 3 model types. epochs=0 — just spawn experts from perfect trees, no training.
experiments:
  - name: allen_cahn_AToE
    problem: allen_cahn
    model: AToE
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: allen_cahn_AToELeaves
    problem: allen_cahn
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: allen_cahn_ANT
    problem: allen_cahn
    model: ANT
    base_architecture: [2, 30, 30, 30, 30, 30, 1]

  - name: ks_AToE
    problem: ks
    model: AToE
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: ks_AToELeaves
    problem: ks
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: ks_ANT
    problem: ks
    model: ANT
    base_architecture: [2, 30, 30, 30, 30, 30, 1]

  - name: burgers1d_AToE
    problem: burgers1d
    model: AToE
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: burgers1d_AToELeaves
    problem: burgers1d
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: burgers1d_ANT
    problem: burgers1d
    model: ANT
    base_architecture: [2, 30, 30, 30, 30, 30, 1]

  - name: schrodinger_AToE
    problem: schrodinger
    model: AToE
    base_architecture: [2, 30, 30, 30, 30, 30, 2]
  - name: schrodinger_AToELeaves
    problem: schrodinger
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 30, 30, 2]
  - name: schrodinger_ANT
    problem: schrodinger
    model: ANT
    base_architecture: [2, 30, 30, 30, 30, 30, 2]

  - name: kdv_AToE
    problem: kdv
    model: AToE
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: kdv_AToELeaves
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
  - name: kdv_ANT
    problem: kdv
    model: ANT
    base_architecture: [2, 30, 30, 30, 30, 30, 1]
