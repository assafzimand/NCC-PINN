# Experiment plan configuration
experiment_name: "loss_based_spawning_150_experts"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  model: AToE  # 'AToE' | 'AToELeaves' | 'ANT'
  activation: tanh
  epochs: 10000
  batch_size: 512
  lr: 0.0001  

  # Optimizer settings
  optimizer_switch_at: 0.8

  # Adam hyperparameters
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

  # LBFGS hyperparameters
  lbfgs_lr: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 20
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0  # Set to 0 to disable gradient-based convergence check
  lbfgs_tolerance_change: 0.0  # Set to 0 to disable loss change convergence check
  
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100
  print_every: 100
  save_every: 5000
  inner_metrics_eval_every: 2000
  seed: 42
  
  # Problem-specific domains and loss weights
  schrodinger:
    spatial_dim: 1
    output_dim: 2  # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    # wavelet_threshold: 20  # OLD METHOD: no longer used; spawning uses mean-loss leaf selection
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  wave1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2π
    # wavelet_threshold: 1  # OLD METHOD: no longer used; spawning uses mean-loss leaf selection
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.003141592653589793  # Viscosity coefficient (effective viscosity = nu/pi = 1/1000, "hard" benchmark)
    # wavelet_threshold: 10  # OLD METHOD: no longer used; spawning uses mean-loss leaf selection
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers2d:
    spatial_dim: 2
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1  # Viscosity coefficient
    # wavelet_threshold: 10  # OLD METHOD: no longer used; spawning uses mean-loss leaf selection
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.001
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.000484
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  fisher_kpp:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 1.0
    kappa: 25.0
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  conv_diff:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    beta: 1.0
    epsilon: 0.01
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]  # 2*pi
    temporal_domain: [0.0, 1.0]
    alpha: 6.25           # 100/16
    beta: 0.390625        # 100/16^2
    gamma: 0.00152587890625  # 100/16^4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  # Dataset sampling ratios
  sampling:
    sample_volume_ratio: 35      # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.005   # 0.5% of residual_train
    boundary_train_ratio: 0.005  # 0.5% of residual_train
    eval_train_ratio: 0.25       # eval = 25% of train (all types)
    ncc_train_ratio: 0.25        # ncc = 25% of residual_train 

  # Adaptive Expert PINN configuration (Tree-Based Spawning)
  adaptive_pinn:
    enabled: true                      # Toggle feature on/off (override per experiment)
    max_experts: 150                    # Maximum number of expert networks
    spawn_every_epochs: 100          # Check for spawning every N epochs (quick test value)
    AToE_threshold_capacity: null        # null = same as base, int = base capacity at threshold norm
    ANT_threshold_architecture: null     # null = uses ANT_default_hidden_layers, list = threshold arch with scaling
    ANT_default_hidden_layers: [70]      # fixed hidden layers for ANT experts when no scaling
    freeze_mode: none                  # "none" | "previous" | "base_only"
    blending_mode: soft                # "hard" | "soft"
    sigma_fraction: 0.2                # For soft: sigma = fraction * region_size (per-dimension)
    base_weight: 1.0                   # Uniform weight for base model (soft blending only)
    base_everywhere: true              # If false, u_0 has indicator = domain \ experts
    tree_max_depth: 15                 # Max depth of decision tree
    tree_min_samples_leaf: 20          # Min samples in tree leaf node
    enable_timing: false               # Enable epoch timing profiling (can slow down training)
    inner_metrics_calculation: false   # Disable NCC/probes during training (complex with experts)
    enable_gradient_diagnostics: false # Enable detailed gradient flow diagnostics (verbose)
    use_decomposed_derivatives: true
    expert_activation_threshold: 1e-9  # null = disabled, float = only evaluate experts with psi > threshold


