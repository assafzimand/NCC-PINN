# Experiment plan configuration
experiment_name: "schrodinger_tests"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  activation: tanh
  epochs: 100
  batch_size: 512
  lr: 0.0001
  
  # Optimizer settings
  optimizer_switch_at: 0.9
  
  # Adam hyperparameters
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  
  # LBFGS hyperparameters
  lbfgs_lr: 1.0
  lbfgs_max_iter: 20
  lbfgs_history_size: 20
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0  # Set to 0 to disable gradient-based convergence check
  lbfgs_tolerance_change: 0.0  # Set to 0 to disable loss change convergence check
  
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 10
  print_every: 10
  save_every: 50
  inner_metrics_eval_every: 40
  seed: 42
  
  # Problem-specific domains and loss weights
  schrodinger:
    spatial_dim: 1
    output_dim: 2  # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  wave1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2π
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers1d:
    spatial_dim: 1
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
  
  burgers2d:
    spatial_dim: 2
    output_dim: 1  # Real-valued: h is scalar
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1  # Viscosity coefficient
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  # Dataset sampling ratios
  sampling:
    sample_volume_ratio: 35      # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.005   # 0.5% of residual_train
    boundary_train_ratio: 0.005  # 0.5% of residual_train
    eval_train_ratio: 0.25       # eval = 25% of train (all types)
    ncc_train_ratio: 0.25        # ncc = 25% of residual_train 

  # Adaptive Expert PINN configuration (Hierarchical Expert Tree)
  adaptive_pinn:
    enabled: true                    # Toggle feature on/off (override per experiment)
    max_experts: 100                   # Maximum number of expert networks
    max_depth: 10                      # Maximum depth in expert tree (NEW)
    overlap_threshold: 0.5            # Accept region if >50% outside siblings (NEW)
    min_samples_per_region: 20       # Min points to search in a subdomain (NEW)
    max_children_coverage: 0.9       # Skip parent if children cover >90% of it (NEW)
    spawn_every_epochs: 10           # Check for spawning every N epochs (quick test value)
    expert_architectures: null        # null = same as base, or list of architectures
    freeze_mode: none                 # "none" | "previous" | "base_only"
    blending_mode: soft               # "hard" | "soft"
    blending_sigma: 0.1               # Legacy: absolute sigma value (deprecated)
    sigma_fraction: 0.2               # For soft: sigma = fraction * region_size (per-dimension)
    base_weight: 1.0                  # Uniform weight for base model (soft blending only)
    base_everywhere: true             # If false, u_0 has indicator = domain \ experts
    rf_n_estimators: 100               # Number of trees in Random Forest
    rf_max_depth: 12                   # Max depth of each tree
    rf_min_samples_leaf: 10           # Min samples required in a leaf node
    wavelet_threshold: 0.1            # Minimum wavelet norm to spawn (filters low-priority regions)
    inner_metrics_calculation: false  # Disable NCC/probes during training (complex with experts)

# Experiments to run
experiments:  
  - name: "adaptive_convergence_test"
    problem: schrodinger
    architecture: [2, 10, 10, 10, 10, 10, 2]

