# Experiment plan configuration
experiment_name: "full_tree_test_new_optimizer"

# Base configuration (will be used for all experiments)
base_config:
  problem: schrodinger
  model: AToE                        # 'AToE' | 'AToELeaves' | 'ANT'
  activation: tanh                   # Activation function for all networks

  # ── Training duration (Phase 3 when using 3-phase, or total when single-phase) ──
  epochs: 1                       # Total training epochs for Phase 3 (full composed model)
  batch_size: 512                    # Mini-batch size for Adam/SOAP training

  # ── Primary optimizer ──
  optimizer: adam                     # Primary optimizer: 'adam' | 'soap'
  lr: 0.001                          # Base (peak) learning rate. Literature standard is 1e-3 (PirateNet, SOAP, vRBA).

  # ── LR scheduling (applies to Adam and SOAP, step-based) ──
  lr_schedule: exponential           # 'none' (constant lr), 'exponential' (step decay), 'cosine' (cosine annealing to 0)
  lr_warmup_steps: 0                 # Steps to linearly ramp lr from ~0 to base lr. 0 = no warmup (paper default).
  lr_decay_rate: 0.9                 # For exponential: multiply lr by this factor every lr_decay_steps. Matches PirateNet/SOAP.
  lr_decay_steps: 5000               # For exponential: how often (in optimizer steps) to decay. Matches PirateNet/SOAP.

  # ── SOAP-specific (only used when optimizer: soap) ──
  soap_betas: [0.95, 0.95]          # SOAP momentum parameters (beta1, beta2). Paper default.
  soap_precondition_frequency: 10    # How often SOAP updates its Shampoo-style preconditioner. Lower = more accurate but slower.

  # ── L-BFGS second stage (only when optimizer: adam; ignored when optimizer: soap) ──
  optimizer_switch_at: 0.75           # Fraction of epochs after which Adam switches to L-BFGS. 1.0 = disabled.
  lbfgs_lr: 1.0                     # L-BFGS learning rate (line search makes this effectively a max step size).
  lbfgs_max_iter: 20                 # Max L-BFGS iterations per step.
  lbfgs_history_size: 20             # L-BFGS history size (number of past updates stored).
  lbfgs_line_search: 'strong_wolfe'  # L-BFGS line search algorithm.
  lbfgs_tolerance_grad: 0.0          # Gradient tolerance for L-BFGS convergence. 0 = disabled.
  lbfgs_tolerance_change: 0.0        # Loss change tolerance for L-BFGS convergence. 0 = disabled.

  # ── Adam hyperparameters ──
  adam_betas: [0.9, 0.999]           # Adam momentum parameters (beta1, beta2). Standard default.
  adam_eps: 1.0e-8                   # Adam epsilon for numerical stability.

  # ── General training settings ──
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100                    # Evaluate every N epochs
  print_every: 100                   # Print progress every N epochs
  save_every: 1000                   # Save checkpoint every N epochs
  inner_metrics_eval_every: 1000     # Run NCC/probes/derivatives analysis every N epochs
  seed: 42

  # ── Problem-specific domains, parameters, and loss weights ──
  schrodinger:
    spatial_dim: 1
    output_dim: 2                    # Complex-valued: h = [u, v]
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 10            # Geometric wavelet norm threshold for tree pruning
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  wave1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 6.283185307179586]  # 2pi
    wavelet_threshold: 5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.003141592653589793         # Viscosity (effective viscosity = nu/pi = 1/1000, "hard" benchmark)
    wavelet_threshold: 3
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  burgers2d:
    spatial_dim: 2
    output_dim: 1
    spatial_domain: [[0.0, 1.0], [0.0, 1.0]]
    temporal_domain: [0.0, 2.0]
    nu: 0.1                          # Viscosity coefficient
    wavelet_threshold: 3
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.001                         # Diffusion coefficient
    wavelet_threshold: 2
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.000484                     # mu^2 = 4.84e-4 (Zabusky & Kruskal values)
    wavelet_threshold: 5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  fisher_kpp:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 1.0
    kappa: 25.0
    wavelet_threshold: 5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  conv_diff:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    beta: 1.0                        # Convection coefficient
    epsilon: 0.01                    # Diffusion coefficient (Peclet = 100)
    wavelet_threshold: 5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]  # 2*pi
    temporal_domain: [0.0, 1.0]
    alpha: 6.25                      # 100/16
    beta: 0.390625                   # 100/16^2
    gamma: 0.00152587890625          # 100/16^4
    wavelet_threshold: 5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0

  # ── Dataset sampling ratios ──
  sampling:
    sample_volume_ratio: 35          # Target: S^(1/d) / V^(1/d) = 35
    initial_train_ratio: 0.005       # 0.5% of residual_train
    boundary_train_ratio: 0.005      # 0.5% of residual_train
    eval_train_ratio: 0.25           # eval = 25% of train (all types)
    ncc_train_ratio: 0.25            # ncc = 25% of residual_train

  # ── Adaptive Expert PINN configuration (Tree-Based Spawning) ──
  adaptive_pinn:
    enabled: true                              # Toggle adaptive expert spawning on/off
    max_experts: 150                           # Maximum number of expert networks
    spawn_every_epochs: 2000                   # Check for spawning every N epochs
    AToE_threshold_capacity: null              # null = same as base, int = base capacity at threshold norm
    ANT_threshold_architecture: null           # null = uses ANT_default_hidden_layers, int = threshold width with scaling
    ANT_default_hidden_layers: 70              # Neuron width for ANT experts (int; expands to [n] mlp or [n,n] resnet)
    expert_type: resnet                        # 'mlp' or 'resnet' -- architecture for base model and experts
    freeze_mode: none                          # "none" | "previous" | "base_only"
    blending_mode: soft                        # "hard" | "soft" (soft = partition of unity)
    sigma_fraction: 0.2                        # For soft blending: sigma = fraction * region_size (per-dimension)
    base_weight: 1.0                           # Uniform weight for base model (soft blending only)
    base_everywhere: true                      # If false, u_0 has indicator = domain \ experts
    tree_max_depth: 15                         # Max depth of decision tree for region splitting
    tree_min_samples_leaf: 50                  # Min samples in tree leaf node
    enable_timing: false                       # Enable epoch timing profiling (can slow down training)
    inner_metrics_calculation: false            # Disable NCC/probes during training (complex with experts)
    enable_gradient_diagnostics: false          # Enable detailed gradient flow diagnostics (verbose)
    use_decomposed_derivatives: true
    expert_activation_threshold: 0             # null = disabled, float = only evaluate experts with psi > threshold
    relevant_samples_to_activate_expert: 0     # Min samples in batch for expert to be considered "active"
    spawning_method: full_tree_by_norm         # "by_mean_loss" | "accept_split_by_norm" | "full_tree_by_norm"

    # ── 3-Phase training config (only used when spawning_method is full_tree_by_norm) ──
    # Phase 1: Train base model alone to get ok-ish predictions for tree fitting.
    # Phase 2: Fit decision tree, prune by wavelet norms, spawn experts (automatic).
    # Phase 3: Train full composed model (base + experts) with top-level config.
    # If initial_train is absent, single-phase behavior is preserved (backwards compatible).
    initial_train:
      epochs: 2000                             # Phase 1: how many epochs to train base model before tree fitting
    reinitialize_base_after_spawn: false        # If true, reinitialize base model weights after expert creation (before Phase 3)


# ===== Experiments to run =====
# 3-phase full_tree_by_norm: Phase 1 trains base (2000 epochs), spawns tree,
# reinitializes base, then Phase 3 trains full model (5001 epochs).
experiments:
  - name: "FullTree_allen_cahn_adam"
    problem: allen_cahn
    base_architecture: [2, 128, 128, 128, 128, 128, 1]  # 5 hidden x 128 neurons

  - name: "FullTree_ks_adam"
    problem: ks
    base_architecture: [2, 128, 128, 128, 128, 128, 1]  # 5 hidden x 128 neurons

  - name: "FullTree_ks_adam_no_lbfgs"
    problem: ks
    base_architecture: [2, 128, 128, 128, 128, 128, 1]  # 5 hidden x 128 neurons
    optimizer_switch_at: 1.0

  - name: "FullTree_burgers1d_adam"
    problem: burgers1d
    base_architecture: [2, 128, 128, 128, 128, 128, 1]

  - name: "FullTree_schrodinger_adam"
    problem: schrodinger
    base_architecture: [2, 128, 128, 128, 128, 128, 2]  # output_dim=2 for complex

  - name: "FullTree_kdv_adam"
    problem: kdv
    base_architecture: [2, 128, 128, 128, 128, 128, 1]
