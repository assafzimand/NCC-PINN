# KdV Primary PAFA Experiments
# Goal: 3 variants × 3 M values × 3 optimizers = 27 runs.
# Purpose: independently select the best (variant, M, optimizer).
# Best result feeds kdv_02_ablation.yaml for feature addition study.
#
# Features (both phases): RWF + Fourier(dim=10,scale=2.0) ONLY.
# No causal, no LRA — from smoke test (kdv_00_smoketest): these are the
# features that give the best Phase 1 convergence without stalling.
#
# Architecture sizing (ResNet, 3 hidden layers, Fourier adds ~15-20%):
#   M=10, [2,37,37,37,1]: ~4,367 params/model × 11 = ~48k total
#   M=20, [2,30,30,30,1]: ~2,911 params/model × 21 = ~61k total
#   M=30, [2,29,29,29,1]: ~1,857 params/model × 31 = ~58k total
#
# Optimizer epochs (mirroring Kiyani et al. arXiv:2501.16371):
#   SOAP:  50 000 epochs (paper comparison budget)
#   LBFGS: 1 000 Adam (warmup) + 30 000 LBFGS  = 31 000 total
#   SSB:   1 000 Adam (warmup) + 30 000 SSBroyden = 31 000 total
#
# Phase 1 (initial_train): always SOAP 10k, betas=[0.95,0.95] (smoke-test validated).

experiment_name: "kdv_01_main"

base_config:
  problem: kdv
  model: AToE                          # overridden per experiment
  activation: tanh
  precision: float64

  # ── Default Phase 3: SOAP ──────────────────────────────────────────────────
  # LBFGS and SSB experiments override epochs, optimizer_1/2, switch point, lr_schedule.
  epochs: 50000
  batch_size: 99999
  patience_epochs: 999999
  min_epochs: 1
  patience_rel_delta: 0.01            # min relative train-loss improvement to reset patience

  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.99, 0.999]            # paper values (arXiv:2502.00604)
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 500
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1                    # 1 quasi-Newton step per epoch (Kiyani style)
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 1000
  print_every: 1000
  save_every: 5000
  inner_metrics_eval_every: 9999999
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════
  # KDV — minimal features: RWF + FF only
  # ══════════════════════════════════════════════════════════════════════════
  kdv:
    pretrained_base_checkpoint: null   # path to a base checkpoint to skip Phase-1 training; null = train Phase 1
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: false
      num_chunks: 16
      tol_schedule: [0.01]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf: true
    fourier_features:
      enabled: true
      dim: 10
      scale: 2.0
      periodic: false
    init:
      hidden: glorot
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 1000
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  # ── Other problems (required by schema; not used) ──────────────────────────
  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf: false
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  # ── Dataset sampling ───────────────────────────────────────────────────────
  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  # ── Adaptive PINN ──────────────────────────────────────────────────────────
  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 10000          # matches initial_train.epochs
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29      # for M=10/20; ANT M=30 overrides to 22
    expert_type: resnet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 0.3
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10                  # overridden per experiment
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    # ── Phase 1: same for all 27 runs ─────────────────────────────────────
    # Features (rwf, fourier, causal, lra) inherit from base config above.
    # soap_betas overridden to [0.95,0.95]: smoke-test validated for 10k Phase 1.
    initial_train:
      epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      soap_betas: [0.95, 0.95]
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  # ════════════════════════════════════════════════════════════════════════════
  # SOAP  —  50 000 epochs, β=[0.99,0.999], exponential LR decay
  # No optimizer override needed; inherits base_config defaults.
  # ════════════════════════════════════════════════════════════════════════════

  # ── AToE ──────────────────────────────────────────────────────────────────
  - name: kdv_atoe_m10_soap
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10

  - name: kdv_atoe_m20_soap
    problem: kdv
    model: AToE
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20

  - name: kdv_atoe_m30_soap
    problem: kdv
    model: AToE
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30

  # ── AToELeaves ────────────────────────────────────────────────────────────
  - name: kdv_leaves_m10_soap
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10

  - name: kdv_leaves_m20_soap
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20

  - name: kdv_leaves_m30_soap
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30

  # ── ANT ───────────────────────────────────────────────────────────────────
  - name: kdv_ant_m10_soap
    problem: kdv
    model: ANT
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
      ANT_default_hidden_layers: 29

  - name: kdv_ant_m20_soap
    problem: kdv
    model: ANT
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
      ANT_default_hidden_layers: 29

  - name: kdv_ant_m30_soap
    problem: kdv
    model: ANT
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
      ANT_default_hidden_layers: 22   # scaled down for smaller per-model budget


  # ════════════════════════════════════════════════════════════════════════════
  # LBFGS  —  Adam(1k epochs) → L-BFGS(30k epochs) = 31k total
  # Constant Adam lr=0.001 (no schedule), then L-BFGS with lr=1.0 (line search).
  # Mirrors Kiyani et al. arXiv:2501.16371 quasi-Newton setup.
  # ════════════════════════════════════════════════════════════════════════════

  # ── AToE ──────────────────────────────────────────────────────────────────
  - name: kdv_atoe_m10_lbfgs
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_atoe_m20_lbfgs
    problem: kdv
    model: AToE
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_atoe_m30_lbfgs
    problem: kdv
    model: AToE
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  # ── AToELeaves ────────────────────────────────────────────────────────────
  - name: kdv_leaves_m10_lbfgs
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_leaves_m20_lbfgs
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_leaves_m30_lbfgs
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  # ── ANT ───────────────────────────────────────────────────────────────────
  - name: kdv_ant_m10_lbfgs
    problem: kdv
    model: ANT
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
      ANT_default_hidden_layers: 29
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_ant_m20_lbfgs
    problem: kdv
    model: ANT
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
      ANT_default_hidden_layers: 29
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_ant_m30_lbfgs
    problem: kdv
    model: ANT
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
      ANT_default_hidden_layers: 22
    epochs: 31000
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0


  # ════════════════════════════════════════════════════════════════════════════
  # SSBroyden  —  Adam(1k epochs) → SSBroyden(30k epochs) = 31k total
  # Same structure as LBFGS but uses SSBroyden (Kiyani paper's preferred quasi-Newton).
  # ════════════════════════════════════════════════════════════════════════════

  # ── AToE ──────────────────────────────────────────────────────────────────
  - name: kdv_atoe_m10_ssb
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_atoe_m20_ssb
    problem: kdv
    model: AToE
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_atoe_m30_ssb
    problem: kdv
    model: AToE
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  # ── AToELeaves ────────────────────────────────────────────────────────────
  - name: kdv_leaves_m10_ssb
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_leaves_m20_ssb
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_leaves_m30_ssb
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  # ── ANT ───────────────────────────────────────────────────────────────────
  - name: kdv_ant_m10_ssb
    problem: kdv
    model: ANT
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
      ANT_default_hidden_layers: 29
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_ant_m20_ssb
    problem: kdv
    model: ANT
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
      ANT_default_hidden_layers: 29
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_ant_m30_ssb
    problem: kdv
    model: ANT
    base_architecture: [2, 29, 29, 29, 1]
    adaptive_pinn:
      M_experts_num: 30
      ANT_default_hidden_layers: 22
    epochs: 31000
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 1000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0
