# KdV Smoke Test — Feature Ablation for Phase 1 Convergence
#
# Purpose: find the right feature set for initial_train (Phase 1).
# The old M_term_tree_verification run got ~0.2 rel-L2 at 2000 epochs with
# ZERO extra features (no causal, no FF, no LRA, no RWF).
# Our kdv_01_main config with all paper features got stuck at 0.67-0.71 because:
#   - Causal tol=0.10 keeps min_weight at 0.96-0.97, blocks convergence
#   - LRA pumps BC weight to 2.4× while residual/IC stay ~0.94 (noise for KdV)
#
# All 6 experiments: AToE, M=10, [2,37,37,37,1].
# Base config = minimal "clean" (no causal, no FF, no LRA, no RWF).
# Each experiment adds features to isolate which ones hurt or help.
#
# Hypothesis: causal (hard tol) is the main killer; FF+RWF may help; LRA is neutral/harmful.

experiment_name: "kdv_00_smoketest"

base_config:
  problem: kdv
  model: AToE
  activation: tanh
  precision: float64

  # ── Phase 3: 1 epoch ──
  epochs: 1
  batch_size: 99999
  patience_epochs: 999999
  min_epochs: 1
  patience_rel_delta: 0.01            # min relative train-loss improvement to reset patience

  # ── Phase 3 optimizer ──
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.95, 0.95]          # match old successful run
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 500
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100
  print_every: 100
  save_every: 9999
  inner_metrics_eval_every: 999999
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════════
  # KDV: MINIMAL baseline — no extra features (matches old successful run)
  # ══════════════════════════════════════════════════════════════════════════════
  kdv:
    pretrained_base_checkpoint: null   # path to a base checkpoint to skip Phase-1 training; null = train Phase 1
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: false                 # OFF in base — experiments override
      num_chunks: 16
      tol_schedule: [0.01]           # easy single-stage when used
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1                       # OFF in base
    fourier_features:
      enabled: false                 # OFF in base
      dim: 10
      scale: 2.0
      periodic: false
    init:
      hidden: parent_weights
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false                 # OFF in base
      update_every: 1000
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 2000
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29
    expert_type: resnet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 1.0
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    initial_train:
      epochs: 2000
      optimizer_1: soap
      optimizer_2: null
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 500

    # ── Staged per-level (AToE / ANT) ──
    new_expert_lr_decay: 1.0
    min_epochs_per_level: 1
    max_epochs_per_level: 2000

    # ── Final joint fine-tune (AToE / ANT) ──
    fine_tune:
      epochs: 2000
      optimizer_1: soap
      optimizer_2: null
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  # ══════════════════════════════════════════════════════════════════════════════
  # All 6 use: AToE, M=10, [2,37,37,37,1]
  # Base = clean (no causal, no FF, no LRA, no RWF)
  # Each experiment adds features to isolate their effect on Phase 1
  # ══════════════════════════════════════════════════════════════════════════════

  # 1. CLEAN baseline — should reproduce ~0.2 rel-L2 from old successful run
  - name: kdv_clean
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    # all features inherit from base (all disabled)

  # 2. RWF + Fourier only — do these two basic enhancements help?
  - name: kdv_rwf_ff
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    kdv:
      rwf:
        enabled: true
        mean: 1.0
        std: 0.1
      fourier_features:
        enabled: true
        dim: 10
        scale: 2.0
        periodic: false

  # 3. Easy causal only — single tol=0.01 (very easy to satisfy, minimal constraint)
  - name: kdv_causal_easy
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    kdv:
      causal_training:
        enabled: true
        num_chunks: 16
        tol_schedule: [0.01]         # single easy stage, very low bar
        min_weight_threshold: 0.99
        per_leaf_causal: false

  # 4. All paper features EXCEPT causal — isolate causal as the killer
  - name: kdv_no_causal
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    kdv:
      rwf:
        enabled: true
        mean: 1.0
        std: 0.1
      fourier_features:
        enabled: true
        dim: 10
        scale: 2.0
        periodic: false
      lra:
        enabled: true
        update_every: 1000
        alpha: 0.1
        scheme: grad_norm
        epsilon: 1.0e-5
      # causal stays disabled

  # 5. All paper features + easy causal tol=[0.01] — best candidate for production?
  - name: kdv_paper_easy_causal
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    kdv:
      rwf:
        enabled: true
        mean: 1.0
        std: 0.1
      fourier_features:
        enabled: true
        dim: 10
        scale: 2.0
        periodic: false
      lra:
        enabled: true
        update_every: 1000
        alpha: 0.1
        scheme: grad_norm
        epsilon: 1.0e-5
      causal_training:
        enabled: true
        num_chunks: 16
        tol_schedule: [0.01]         # easy single stage
        min_weight_threshold: 0.99
        per_leaf_causal: false

  # 6. ALL paper features with hard causal tol=[0.1, 1.0, 10.0] — our broken config, for comparison
  - name: kdv_paper_hard_causal
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10
    kdv:
      rwf:
        enabled: true
        mean: 1.0
        std: 0.1
      fourier_features:
        enabled: true
        dim: 10
        scale: 2.0
        periodic: false
      lra:
        enabled: true
        update_every: 1000
        alpha: 0.1
        scheme: grad_norm
        epsilon: 1.0e-5
      causal_training:
        enabled: true
        num_chunks: 16
        tol_schedule: [0.1, 1.0, 10.0]   # hard — this is what broke the first run
        min_weight_threshold: 0.99
        per_leaf_causal: false
