# PirateNet KdV Reproduction
# Goal: faithfully reproduce the SOAP paper (arXiv:2502.00604) KdV result
# (rel-L2 ~3.4e-4) using a vanilla PirateNet base (M=0 experts).
#
# Architecture:  PirateNet 3 blocks × 256 hidden units = 9 hidden layers
#                base_architecture [2,256×9,1]
# Optimizer:     SOAP, betas=[0.99,0.95], precondition_freq=2
# LR schedule:   1e-3, exponential, decay_rate=0.9, decay_steps=2000,
#                warmup=5000 steps (factor 0.01)
# Epochs:        20 000 (Phase 1 only; M=0 so no tree spawn)
#                paper notes SOAP reaches ~1e-4 within first ~10k iters,
#                so 20k is a fast faithfulness check (full result uses 1e5)
# Batch:         full batch (batch_size >> dataset size → 1 step/epoch)
# Features:      Periodic FF (dim=128, scale=2.0), RWF (mean=1.0,std=0.1),
#                Causal-16 (tol=[1.0]), LRA grad_norm (alpha=0.1)
# n_residual:    8192 (matches JaxPI), resampled every epoch (residual only)
# Precision:     float32 (matches JaxPI)
# BC loss:       auto-skipped because periodic FF is enabled (use_bc=False)

experiment_name: "piratenet_reproduce"

base_config:
  problem: kdv
  model: AToE
  activation: tanh
  precision: float32
  debug_prints: true         # gate PirateNet alpha/causal-chunk/LR prints

  # ── Optimizer (Phase 1 inherits these; Phase 3 unused because M=0) ─────────
  # Paper Table 6: lr=1e-3, betas=[0.99,0.95], precondition_freq=2,
  #               decay 0.9 every 2 000 steps, 5 000-step warmup.
  epochs: 1                        # Phase 3 epochs (M=0 → never reaches Phase 3)
  batch_size: 99999                # full-batch → 1 gradient step per epoch
  patience_epochs: 999999
  min_epochs: 1
  patience_rel_delta: 0.01

  optimizer_1: adam
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.99, 0.95]
  soap_precondition_frequency: 2
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_warmup_steps: 5000
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100
  print_every: 100
  save_every: 10000
  inner_metrics_eval_every: 9999999
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════
  # KDV — full PirateNet feature set matching SOAP paper Table 6
  # ══════════════════════════════════════════════════════════════════════════
  kdv:
    pretrained_base_checkpoint: null
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0    # bc term auto-skipped when periodic=true (use_bc guard)
    # Causal training: 16 chunks, tolerance=[1.0] (JaxPI setting)
    causal_training:
      enabled: true
      num_chunks: 16
      tol_schedule: [0.001, 0.01, 0.1, 1.0]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    # RWF: mu=1.0, sigma=0.1 (JaxPI defaults, now correct init)
    rwf:
      enabled: true
      mean: 1.0
      std: 0.1
    # Periodic FF: dim=128, scale=2.0 — enforces periodicity in architecture
    fourier_features:
      enabled: true
      dim: 128
      scale: 2.0
      periodic: true
    init:
      hidden: glorot
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    # LRA: grad_norm weighting, alpha=0.1, update every 1000 iters
    lra:
      enabled: true
      scheme: grad_norm
      alpha: 0.1
      update_every: 1000
      epsilon: 0.01
    # Adaptive sampling disabled (JaxPI uses uniform residual sampling)
    adaptive_sampling:
      enabled: false
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  # ── Other problems (required by schema; not used in this run) ─────────────
  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  # ── Dataset sampling ────────────────────────────────────────────────────────
  # n_residual_train overrides the hardcoded 10000 default.
  # resample_every_epochs: 1 → lightweight residual-only resample each epoch.
  sampling:
    n_residual_train: 8192         # JaxPI batch size; overrides hardcoded 10000
    sample_volume_ratio: 35
    initial_train_ratio: 0.026     # ~213 IC points
    boundary_train_ratio: 0.026    # ~213 BC points (skipped in loss when periodic)
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 1       # new residual (x,t) every epoch (cheap)
    min_points_per_leaf: 50

  # ── Adaptive PINN: vanilla base (M=0 = no experts) ─────────────────────────
  adaptive_pinn:
    enabled: true
    max_experts: 0
    spawn_every_epochs: 999999     # effectively never spawn
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 256
    expert_type: piratenet         # future AToE experts will also be PirateNet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 0.3
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: true
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 0               # vanilla PINN — no tree, no experts
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    # Phase 1: 20 000 SOAP steps (fast check; paper's full run is 1e5 iters)
    initial_train:
      epochs: 20000
      optimizer_1: soap
      optimizer_2: null
      soap_betas: [0.99, 0.95]
      soap_precondition_frequency: 2
      soap_weight_decay: 0.0
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      lr_warmup_steps: 5000
      lr_warmup_start_factor: 0.01


experiments:
  # Single run: vanilla PirateNet (M=0) matching SOAP paper Table 6 KdV setup.
  # PirateNet 3 blocks × 256 hidden = 9 hidden layers = architecture below.
  - name: piratenet_reproduce_kdv
    problem: kdv
    model: AToE
    # [2, 256×9, 1] → 3 PirateNet residual blocks of width 256
    base_architecture: [2, 256, 256, 256, 256, 256, 256, 256, 256, 256, 1]
