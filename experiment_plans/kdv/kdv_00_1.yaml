# KdV Follow-up — Targeted Fix Experiments
#
# Background: kdv_01_main revealed a trainer bug where Phase 3 optimizer is
# NOT recreated for M_term_tree_by_norm spawning. The trainer.py fix (Step 6
# in the plan) must be applied before running this file.
#
# Root cause of the 0.12 rel-L2 floor:
#   Phase 1 end (epoch 10000): 0.1416 rel-L2
#   Phase 3 first eval (epoch 11000): 0.5944 rel-L2 (+4×!)
#   → Phase 3 ran with Phase 1's soap_betas=[0.95,0.95] and lr_decay_steps=500
#     instead of the intended [0.99,0.999] and 1000.
#
# After the fix, Phase 3 starts correctly and should NOT spike.
# All 7 experiments are single-variable ablations on top of the fixed baseline.
#
# Base: AToE M=10 [2,37,37,37,1] (Run A from kdv_01_main — best performer)
# Phase 1: SOAP [0.95,0.95], 10k epochs (unchanged — was working correctly)
# Phase 3: SOAP [0.99,0.999], 90k epochs, lr=0.001, exp decay 0.98/1000
# Patience: stop if train loss flat for 10k epochs (after min 20k Phase 3 epochs)

experiment_name: "kdv_00_1"

base_config:
  problem: kdv
  model: AToE
  activation: tanh
  precision: float64                    # override to float32 in fp32 experiment

  # ── Phase 3: SOAP, 90k epochs ──────────────────────────────────────────────
  epochs: 90000
  batch_size: 99999
  patience_epochs: 10000               # stop if 10k epochs without train-loss improvement
  min_epochs: 20000                    # must run 20k Phase 3 epochs before patience applies
  patience_rel_delta: 0.01            # min relative train-loss improvement to reset patience

  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001                            # override to 0.002 in lr_high experiment
  soap_betas: [0.99, 0.999]
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 500
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 1000
  print_every: 1000
  save_every: 10000
  inner_metrics_eval_every: 9999999
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════
  # KDV — same minimal features as kdv_01_main (RWF + FF, no causal, no LRA)
  # ══════════════════════════════════════════════════════════════════════════
  kdv:
    pretrained_base_checkpoint: null   # path to a base checkpoint to skip Phase-1 training; null = train Phase 1
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: false
      num_chunks: 16
      tol_schedule: [0.01]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf:
      enabled: true
      mean: 1.0
      std: 0.1
    fourier_features:
      enabled: true
      dim: 10
      scale: 2.0
      periodic: false
    init:
      hidden: parent_weights                   # override to 'parent_weights' in parent experiment
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 1000
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  # ── Other problems (required by schema; not used) ──────────────────────
  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  # ── Dataset sampling ────────────────────────────────────────────────────
  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500         # override to 100 in resample experiment
    min_points_per_leaf: 50

  # ── Adaptive PINN ────────────────────────────────────────────────────────
  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 10000
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29
    expert_type: resnet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 1.0
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false  # override to true in reinit experiments
    split_icbc: { enabled: false }

    # ── Phase 1: 10k epochs, SOAP [0.95,0.95] (working correctly) ──────────
    initial_train:
      epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      soap_betas: [0.95, 0.95]
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0

    # ── Staged per-level (AToE / ANT) ──
    new_expert_lr_decay: 1.0
    min_epochs_per_level: 1
    max_epochs_per_level: 10000

    # ── Final joint fine-tune (AToE / ANT) ──
    fine_tune:
      epochs: 0
      optimizer_1: soap
      optimizer_2: null
      soap_betas: [0.95, 0.95]
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 1: FIXED BASELINE
  # Run A config (kdv_atoe_m10_soap from kdv_01_main) + trainer fix only.
  # Expected: no spike at epoch 11000; Phase 3 starts at ~0.14 not 0.59.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_fixed
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 2: REINITIALIZE BASE AFTER SPAWN
  # Hypothesis: Phase 1 may trap the base in a local minimum. Reinitializing
  # before Phase 3 forces a fresh start with the expert structure already in
  # place — experts provide structural bias while base relearns from scratch.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_reinit
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      reinitialize_base_after_spawn: true

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 3: PARENT-WEIGHTS EXPERT INIT
  # Experts copy hidden layers from base model at spawn (glorot → base weights),
  # output layer stays zero. Experts start with the base's learned spatial
  # representation and immediately learn meaningful residuals.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_parent
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      init:
        hidden: parent_weights
        output: default

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 4: FASTER RESAMPLING
  # Adaptive sampling every 100 epochs (was 500). Collocation points track
  # residual hotspots 5× more frequently — useful when Phase 3 loss landscape
  # shifts quickly after the optimizer/spawn transition.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_resample
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    sampling:
      resample_every_epochs: 100

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 5: HIGHER LEARNING RATE
  # lr=0.002 instead of 0.001. Tests if Phase 3 is limited by gradient step
  # size rather than model capacity or local minima depth.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_lr_high
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    lr: 0.002

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 6: FLOAT32 PRECISION
  # 2× throughput at the cost of reduced numerical precision. KdV with
  # third-order derivative h_xxx can amplify float32 errors — this test
  # determines if float64 is strictly necessary.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_fp32
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    precision: float32

  # ══════════════════════════════════════════════════════════════════════════
  # Experiment 7: COMBINED BEST
  # All promising individual changes combined: reinit base, parent-weights
  # expert init, faster resampling, higher LR. Expected best performer.
  # ══════════════════════════════════════════════════════════════════════════
  - name: kdv_00_1_best
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    lr: 0.002
    sampling:
      resample_every_epochs: 100
    kdv:
      init:
        hidden: parent_weights
        output: default
    adaptive_pinn:
      reinitialize_base_after_spawn: true

