# KdV Ablation Experiments
# Goal: Understand which features/optimizer/capacity settings matter most.
#
# Reference baseline for all runs: AToE, M=10, [2,37,37,37,1], full features, SOAP.
# (This matches kdv_atoe_m10 from kdv_01_main.yaml.)
#
# NOTE: All experiments below use AToE M=10 as the reference variant.
# ⚠️  TODO before running: verify with kdv_01_main.yaml results which variant
#     (AToE / AToELeaves / ANT) and which M (10 / 20) performs best, then
#     re-run the critical ablations on that best combination.
#     Consider creating separate kdv_02_ablation_{atoe,atoe_leaves,ant}.yaml files
#     if findings appear variant-dependent.

experiment_name: "kdv_02_ablation"

base_config:
  problem: kdv
  model: AToE
  activation: tanh
  precision: float64

  # ── Phase 3 duration ──
  epochs: 50000
  batch_size: 99999
  patience_epochs: 999999
  min_epochs: 1
  patience_rel_delta: 0.01            # min relative train-loss improvement to reset patience

  # ── Phase 3 default optimizer: SOAP (same as kdv_01_main) ──
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.99, 0.999]
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 500
  lr_warmup_start_factor: 0.01

  # ── Adam / LBFGS / SSBroyden hyperparams ──
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  # ── General settings ──
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100
  print_every: 100
  save_every: 5000
  inner_metrics_eval_every: 999999
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════════
  # PER-PROBLEM CONFIGURATION
  # ══════════════════════════════════════════════════════════════════════════════

  kdv:
    pretrained_base_checkpoint: null   # path to a base checkpoint to skip Phase-1 training; null = train Phase 1
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: true
      num_chunks: 16
      tol_schedule: [0.1, 1.0, 10.0]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf:
      enabled: true
      mean: 1.0
      std: 0.1
    fourier_features:
      enabled: true
      dim: 10
      scale: 2.0
      periodic: false
    init:
      hidden: parent_weights
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: true
      update_every: 1000
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  # ── Other problems (required by schema; not used) ──
  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  # ── Dataset sampling ──
  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  # ── Adaptive PINN (reference: AToE M=10 [2,37,37,37,1]) ──
  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 2000
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29
    expert_type: resnet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 1.0
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    initial_train:
      epochs: 2000
      optimizer_1: soap
      optimizer_2: null
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0

    # ── Staged per-level (AToE / ANT) ──
    new_expert_lr_decay: 1.0
    min_epochs_per_level: 1
    max_epochs_per_level: 2000

    # ── Final joint fine-tune (AToE / ANT) ──
    fine_tune:
      epochs: 2000
      optimizer_1: soap
      optimizer_2: null
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  # ══════════════════════════════════════════════════════════════════════════════
  # FEATURE ABLATIONS  (all: AToE M=10 [2,37,37,37,1])
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_no_causal
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      causal_training:
        enabled: false

  - name: kdv_no_lra
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      lra:
        enabled: false

  - name: kdv_no_fourier
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      fourier_features:
        enabled: false

  # ══════════════════════════════════════════════════════════════════════════════
  # OPTIMIZER ABLATIONS
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_adam_lbfgs
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    # Phase 3: Adam warmup → L-BFGS refinement
    optimizer_1: adam
    optimizer_2: lbfgs
    optimizer_switch_epoch: 5000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  - name: kdv_adam_ssbroyden
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    # Phase 3: Adam warmup → SSBroyden (like Kiyani run 4)
    optimizer_1: adam
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 5000
    lr: 0.001
    lr_schedule: none
    lr_warmup_steps: 0

  # ══════════════════════════════════════════════════════════════════════════════
  # SAMPLING ABLATION
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_per_leaf_sampling
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      adaptive_sampling:
        enabled: true
        adaptive_ratio: 0.3
        per_leaf_sampling: true        # distribute adaptive budget per leaf region
        phi: quadratic
        phi_epsilon: 1.0
        phi_power: 2.0
    sampling:
      resample_every_epochs: 500
      min_points_per_leaf: 50

  # ══════════════════════════════════════════════════════════════════════════════
  # CAPACITY ABLATIONS  (M=30, M=40 with downsized arch from bank)
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_m30
    problem: kdv
    base_architecture: [2, 29, 29, 1]  # ~1857 params × 31 = ~58k total
    adaptive_pinn:
      M_experts_num: 30

  - name: kdv_m40
    problem: kdv
    base_architecture: [2, 29, 29, 1]  # ~1857 params × 41 = ~76k total
    adaptive_pinn:
      M_experts_num: 40

  # ══════════════════════════════════════════════════════════════════════════════
  # INITIALIZATION ABLATION
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_reinit_base
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    # Base model reset after Phase 1 tree discovery → retrained from scratch in Phase 3
    adaptive_pinn:
      reinitialize_base_after_spawn: true

  # ══════════════════════════════════════════════════════════════════════════════
  # BLENDING PARAMETER ABLATIONS  (sigma_fraction and base_weight)
  # ══════════════════════════════════════════════════════════════════════════════

  - name: kdv_sigma_small
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      sigma_fraction: 0.1              # sharper region boundaries

  - name: kdv_sigma_large
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      sigma_fraction: 0.3              # softer region boundaries

  - name: kdv_base_weight_high
    problem: kdv
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      base_weight: 1.0                 # equal base/expert weighting (vs 0.3 default)


# ══════════════════════════════════════════════════════════════════════════════
# ⚠️  IMPORTANT NOTE
# ══════════════════════════════════════════════════════════════════════════════
# ALL RUNS ABOVE USE AToE M=10 AS THE REFERENCE VARIANT.
# This is a placeholder — the optimal variant and M are unknown until
# kdv_01_main.yaml results are available.
#
# BEFORE DRAWING CONCLUSIONS:
#   1. Run kdv_01_main.yaml and identify the best (variant, M) combination.
#   2. Re-run any ablations that matter for the paper on that best combination.
#   3. Consider creating per-variant ablation files:
#        kdv_02_ablation_atoe.yaml
#        kdv_02_ablation_atoe_leaves.yaml
#        kdv_02_ablation_ant.yaml
#      if findings differ substantially across variants.
# ══════════════════════════════════════════════════════════════════════════════
