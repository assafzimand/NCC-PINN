# KdV Primary PAFA Experiments
# Goal: All three variants × M=10 and M=20 with full paper-matching feature set.
# Target: beat arXiv:2502.00604 PirateNet (~500k params, 3.40e-4 rel-L2) at ~50-80k total params.
#
# Architecture sizing (ResNet, no Fourier baseline; ~15-20% more with Fourier dim=10):
#   M=10, [2,37,37,37,1]: ~4367 params/model × 11 = ~48k total
#   M=20, [2,30,30,30,1]: ~2911 params/model × 21 = ~61k total
#
# Phase 1 (initial_train): 2000 epochs SOAP — short tree-discovery pass only.
# Phase 3 (epochs):        50000 epochs SOAP — the real training.
# Features (both phases):  LRA + causal + Fourier(scale=2.0) + RWF + adaptive sampling.

experiment_name: "kdv_01_main"

base_config:
  problem: kdv
  model: AToE                          # overridden per experiment
  activation: tanh
  precision: float64

  # ── Phase 3 duration ──
  epochs: 50000
  batch_size: 99999                    # full-batch
  patience_epochs: 999999
  min_epochs: 1

  # ── Phase 3 optimizer: SOAP (paper's best) ──
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.99, 0.999]
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 500
  lr_warmup_start_factor: 0.01
  new_expert_lr_decay: 1.0

  # ── Adam / LBFGS / SSBroyden hyperparams (unused here, kept for completeness) ──
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  # ── General settings ──
  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 100
  print_every: 100
  save_every: 5000
  inner_metrics_eval_every: 1000
  seed: 42

  # ══════════════════════════════════════════════════════════════════════════════
  # PER-PROBLEM CONFIGURATION
  # ══════════════════════════════════════════════════════════════════════════════

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022                          # Zabusky & Kruskal 1965 (code uses mu^2 = 0.000484)
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: true
      num_chunks: 16                   # paper: 16
      tol_schedule: [0.1, 1.0, 10.0]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf: true
    fourier_features:
      enabled: true
      dim: 10                          # spatial only → effective input 1+2×10=21
      scale: 2.0                       # paper value
      periodic: false
    init:
      hidden: glorot
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: true
      update_every: 1000               # paper: every 1000 iters
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  # ── Other problems (required by schema; not used in this plan) ──
  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  allen_cahn:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1.0], min_weight_threshold: 0.99}
    rwf: false
    fourier_features: {enabled: false, dim: 128, scale: 3.0, periodic: false}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf: false
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: glorot, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  # ── Dataset sampling ──
  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  # ── Adaptive PINN ──
  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 99999
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29      # aligns with [2,29,29,1] bank entry
    expert_type: resnet
    freeze_mode: none
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 0.3                   # from existing KdV run
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10                  # overridden per experiment
    perfect_trees_path: perfect_tree_examples/perfect_trees.json
    freeze_epochs_after_spawn: 0
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    # ── Phase 1: always the same — short tree-discovery pass ──
    # Features (lra, rwf, fourier, causal) are NOT overridden here;
    # they inherit from the kdv section above, so Phase 1 and Phase 3
    # share identical feature settings.
    initial_train:
      epochs: 2000
      optimizer_1: soap
      optimizer_2: null
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  # ══════════════════════════════════════════════════════════════════════════════
  # 6 runs: 3 variants × 2 M values
  # ══════════════════════════════════════════════════════════════════════════════

  # ── AToE ──────────────────────────────────────────────────────────────────────
  - name: kdv_atoe_m10
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]   # ~4367 params × 11 = ~48k total
    adaptive_pinn:
      M_experts_num: 10

  - name: kdv_atoe_m20
    problem: kdv
    model: AToE
    base_architecture: [2, 30, 30, 30, 1]   # ~2911 params × 21 = ~61k total
    adaptive_pinn:
      M_experts_num: 20

  # ── AToELeaves ────────────────────────────────────────────────────────────────
  - name: kdv_atoe_leaves_m10
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10

  - name: kdv_atoe_leaves_m20
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20

  # ── ANT ───────────────────────────────────────────────────────────────────────
  - name: kdv_ant_m10
    problem: kdv
    model: ANT
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      M_experts_num: 10

  - name: kdv_ant_m20
    problem: kdv
    model: ANT
    base_architecture: [2, 30, 30, 30, 1]
    adaptive_pinn:
      M_experts_num: 20
