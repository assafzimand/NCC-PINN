# M_term cleanup smoke test (branch M_term_AToE-AToE-leaves-ANT)
#
# Tiny 3-phase runs (~3 Phase-1 + ~3 Phase-3 epochs) to verify the cleaned-up
# training flow end-to-end on CPU. Drive with: python scripts/run_smoke.py
#
# Per-scenario checks (the driver asserts these):
#   smoke_atoe_glorot   -> [3-Phase] Phase 1, [FullTree] Spawning complete,
#                          [3-Phase FIX] Phase 3 optimizer recreated; experts spawned
#   smoke_atoe_reinit   -> [Reinit] Base model reinitialized
#   smoke_atoe_parent   -> [ParentInit] ... output copied
#   smoke_atoeleaves    -> spawns, [3-Phase FIX]
#   smoke_ant           -> spawns, [3-Phase FIX]
#   smoke_optswitch     -> OPTIMIZER SWITCH: SOAP -> SSBROYDEN
#   smoke_patience      -> [EarlyStop] (only in Phase 3, epoch >= Phase-3 start)
#   smoke_pretrained    -> [PretrainedBase] Loaded base, [3-Phase] Phase 1 skipped
#                          (pretrained_base_checkpoint filled in by the driver)

experiment_name: "m_term_smoke"

base_config:
  problem: kdv
  model: AToE
  activation: tanh
  precision: float32

  epochs: 3                            # Phase 3 epochs
  batch_size: 99999                    # full batch
  patience_epochs: 999999              # disabled by default
  min_epochs: 1
  patience_rel_delta: 0.01

  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 999999
  lr: 0.001
  soap_betas: [0.99, 0.999]
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 0
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 1
  print_every: 1
  save_every: 9999
  inner_metrics_eval_every: 9999999
  seed: 42

  kdv:
    pretrained_base_checkpoint: null
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: false
      num_chunks: 16
      tol_schedule: [0.01]
      min_weight_threshold: 0.99
      per_leaf_causal: false
    rwf: true
    fourier_features:
      enabled: true
      dim: 10
      scale: 2.0
      periodic: false
    init:
      hidden: glorot
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 1000
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: true
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 3              # spawn at the end of the 3-epoch Phase 1
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29
    expert_type: resnet
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 0.3
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 3
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    initial_train:
      epochs: 3                        # short Phase 1
      optimizer_1: soap
      optimizer_2: null
      soap_betas: [0.95, 0.95]
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 500
      lr_warmup_steps: 0


experiments:
  - name: smoke_atoe_glorot
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]

  - name: smoke_atoe_reinit
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    adaptive_pinn:
      reinitialize_base_after_spawn: true

  - name: smoke_atoe_parent
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      init:
        hidden: parent_weights
        output: default

  - name: smoke_atoeleaves
    problem: kdv
    model: AToELeaves
    base_architecture: [2, 37, 37, 37, 1]
    kdv:
      init:
        hidden: parent_weights
        output: default

  - name: smoke_ant
    problem: kdv
    model: ANT
    base_architecture: [2, 37, 37, 37, 1]

  - name: smoke_optswitch
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    optimizer_2: ssbroyden
    optimizer_switch_epoch: 2

  - name: smoke_patience
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    epochs: 8
    patience_epochs: 2
    min_epochs: 0
    patience_rel_delta: 0.9

  - name: smoke_pretrained
    problem: kdv
    model: AToE
    base_architecture: [2, 37, 37, 37, 1]
    # pretrained_base_checkpoint is filled in by scripts/run_smoke.py
    # using smoke_atoe_glorot's final checkpoint.
