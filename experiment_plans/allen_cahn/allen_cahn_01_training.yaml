# Allen-Cahn Training-Method Ablation (on top of the 00 winner)
#
# ⚠️ PLACEHOLDER BASE: before launching, set `model` / `base_architecture` /
#    `M_experts_num` (and ANT_default_hidden_layers if ANT) in base_config below to the
#    BEST (variant, M) from allen_cahn_00_main.yaml. Currently set to AToE M=10.
#
# Optimizer / switch / lr / lr_schedule are FIXED from 00 (Kiyani adam→ssbroyden, lr=0.005,
# exponential 0.98/1000). This file varies ONLY features / init / expert structure — single-
# variable ablations on top of the clean baseline, plus a combined "best".
#
#   baseline       — winner config unchanged (control)
#   adaptive       — adaptive sampling ON (off in 00)
#   fourier        — Fourier features ON (dim 10, scale 3.0 — sharp AC interface)
#   rwf            — RWF ON
#   expert_resnet  — expert_type resnet (mlp in 00)
#   parent_init    — init.hidden parent_weights
#   reinit_base    — reinitialize_base_after_spawn true
#   best           — combine the promising levers (edit after seeing single-lever results)

experiment_name: "allen_cahn_01_training"

base_config:
  problem: allen_cahn
  model: AToE                          # ← set to 00 winner variant
  activation: tanh
  precision: float64
  base_architecture: [2, 37, 37, 37, 1]  # ← set to 00 winner architecture

  epochs: 35000
  batch_size: 99999
  patience_epochs: 999999
  min_epochs: 1
  patience_rel_delta: 0.01            # min relative train-loss improvement to reset patience

  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 5000
  lr: 0.005
  soap_betas: [0.95, 0.95]
  soap_precondition_frequency: 10
  soap_weight_decay: 0.0
  lr_schedule: exponential
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_warmup_steps: 0
  lr_warmup_start_factor: 0.01

  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  lbfgs_lr: 1.0
  lbfgs_max_iter: 1
  lbfgs_history_size: 100
  lbfgs_line_search: 'strong_wolfe'
  lbfgs_tolerance_grad: 0.0
  lbfgs_tolerance_change: 0.0
  ssbroyden_lr: 1.0
  ssbroyden_tolerance_grad: 1.0e-10

  cuda: true
  eval_only: false
  resume_from: null
  bins: 5
  n_bin_visualize_ncc: 100
  n_freq_grid: 128
  eval_every: 1000
  print_every: 1000
  save_every: 5000
  inner_metrics_eval_every: 9999999
  seed: 42

  allen_cahn:
    pretrained_base_checkpoint: null   # path to a base checkpoint to skip Phase-1 training; null = train Phase 1
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    D: 0.0001
    wavelet_threshold: 0.002
    new_norm_threshold: 0.04
    tree_smoothness_threshold: 0.5
    loss_weights:
      residual: 1.0
      ic: 1.0
      bc: 1.0
    causal_training:
      enabled: false
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
      min_weight_threshold: 0.99
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features:
      enabled: false
      dim: 10
      scale: 3.0
      periodic: false
    init:
      hidden: parent_weights
      output: default
      ls_use_bias: false
      spectral_norm: false
      spectral_norm_init_std: 1.0e-6
    lra:
      enabled: false
      update_every: 100
      alpha: 0.1
      scheme: grad_norm
      epsilon: 1.0e-5
    adaptive_sampling:
      enabled: false
      adaptive_ratio: 0.3
      per_leaf_sampling: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching:
      enabled: false
      num_windows: 5
      freeze_previous_windows: true
      m_distribution: quadratic

  schrodinger:
    spatial_dim: 1
    output_dim: 2
    spatial_domain: [[-5.0, 5.0]]
    temporal_domain: [0.0, 1.5707963267948966]
    wavelet_threshold: 0.1
    new_norm_threshold: 2.0
    tree_smoothness_threshold: 0.7
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  burgers1d:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    nu: 0.01
    wavelet_threshold: 0.001
    new_norm_threshold: 0.015
    tree_smoothness_threshold: 0.5
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 128, scale: 1.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  kdv:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[-1.0, 1.0]]
    temporal_domain: [0.0, 1.0]
    mu: 0.022
    wavelet_threshold: 0.0025
    new_norm_threshold: 0.2
    tree_smoothness_threshold: 0.4
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 16, tol_schedule: [0.01], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: false, dim: 10, scale: 2.0, periodic: false}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 1000, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: false, adaptive_ratio: 0.3, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: false, num_windows: 5, freeze_previous_windows: true, m_distribution: quadratic}

  ks:
    spatial_dim: 1
    output_dim: 1
    spatial_domain: [[0.0, 6.283185307179586]]
    temporal_domain: [0.0, 1.0]
    alpha: 6.25
    beta: 0.390625
    gamma: 0.00152587890625
    wavelet_threshold: 0.04
    new_norm_threshold: 10.0
    tree_smoothness_threshold: 0.3
    loss_weights: {residual: 1.0, ic: 1.0, bc: 1.0}
    causal_training: {enabled: false, num_chunks: 32, tol_schedule: [0.01, 0.1, 1], min_weight_threshold: 0.99, per_leaf_causal: false}
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    fourier_features: {enabled: true, dim: 10, scale: 1.0, periodic: true}
    init: {hidden: parent_weights, output: default, ls_use_bias: false, spectral_norm: false, spectral_norm_init_std: 1.0e-6}
    lra: {enabled: false, update_every: 100, alpha: 0.1, scheme: grad_norm, epsilon: 1.0e-5}
    adaptive_sampling: {enabled: true, adaptive_ratio: 0.5, per_leaf_sampling: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    grad_clip_norm: null
    expert_grad_clip_norm: null
    time_marching: {enabled: true, num_windows: 20, freeze_previous_windows: true, m_distribution: equal}

  sampling:
    sample_volume_ratio: 35
    initial_train_ratio: 0.026
    boundary_train_ratio: 0.026
    eval_train_ratio: 0.25
    ncc_train_ratio: 0.25
    resample_every_epochs: 500
    min_points_per_leaf: 50

  adaptive_pinn:
    enabled: true
    max_experts: 150
    spawn_every_epochs: 10000
    variable_for_node_accept: norm
    variable_for_expert_size: norm
    AToE_threshold_capacity: null
    ANT_threshold_architecture: null
    ANT_default_hidden_layers: 29      # ← set to 00 winner if ANT
    expert_type: mlp
    blending_mode: soft
    sigma_fraction: 0.2
    base_weight: 1.0
    base_everywhere: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    enable_timing: false
    inner_metrics_calculation: false
    enable_gradient_diagnostics: false
    use_decomposed_derivatives: false
    expert_activation_threshold: 0
    relevant_samples_to_activate_expert: 0
    spawning_method: M_term_tree_by_norm
    M_experts_num: 10                  # ← set to 00 winner M
    spawn_require_plateau: false
    spawn_plateau_epochs: 50
    spawn_plateau_delta: 0.05
    spawn_retries_before_stop: false
    spawn_retry_after: 10
    reinitialize_base_after_spawn: false

    initial_train:
      epochs: 10000
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 5000
      lr: 0.005
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_warmup_steps: 0

    # ── Staged per-level (AToE / ANT) ──
    new_expert_lr_decay: 1.0
    min_epochs_per_level: 1
    max_epochs_per_level: 10000

    # ── Final joint fine-tune (AToE / ANT) ──
    fine_tune:
      epochs: 10000
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 5000
      lr: 0.001
      lr_schedule: exponential
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_warmup_steps: 0


experiments:
  # control
  - name: allen_cahn_01_baseline
    problem: allen_cahn

  # enable adaptive sampling (off in 00)
  - name: allen_cahn_01_adaptive
    problem: allen_cahn
    allen_cahn:
      adaptive_sampling:
        enabled: true
        adaptive_ratio: 0.3

  # Fourier features
  - name: allen_cahn_01_fourier
    problem: allen_cahn
    allen_cahn:
      fourier_features:
        enabled: true
        dim: 10
        scale: 3.0
        periodic: false

  # RWF
  - name: allen_cahn_01_rwf
    problem: allen_cahn
    allen_cahn:
      rwf:
        enabled: true
        mean: 1.0
        std: 0.1

  # ResNet experts
  - name: allen_cahn_01_expert_resnet
    problem: allen_cahn
    adaptive_pinn:
      expert_type: resnet

  # parent-weights expert init
  - name: allen_cahn_01_parent_init
    problem: allen_cahn
    allen_cahn:
      init:
        hidden: parent_weights
        output: default

  # reinitialize base after spawn
  - name: allen_cahn_01_reinit_base
    problem: allen_cahn
    adaptive_pinn:
      reinitialize_base_after_spawn: true

  # combined best (edit after single-lever results)
  - name: allen_cahn_01_best
    problem: allen_cahn
    allen_cahn:
      adaptive_sampling:
        enabled: true
        adaptive_ratio: 0.3
      fourier_features:
        enabled: true
        dim: 10
        scale: 3.0
        periodic: false
      init:
        hidden: parent_weights
        output: default
    adaptive_pinn:
      reinitialize_base_after_spawn: true
